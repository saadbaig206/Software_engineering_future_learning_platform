services:
  # 1. Reverse Proxy & Edge Gateway
  nginx:
    image: nginx:alpine
    container_name: futurelearning_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - futurelearning_net

  # 2. Next.js App Router Client
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: futurelearning_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    ports:
      - "3000:3000"
    networks:
      - futurelearning_net

  # 3. Django REST Framework Monolith
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: futurelearning_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - futurelearning_net

  # 4. Redis Cache, Session Store & Task Broker
  redis:
    image: redis:7-alpine
    container_name: futurelearning_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - futurelearning_net

  # 5. Celery Asynchronous Task Worker
  celery_worker:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: futurelearning_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info -Q default,media,adaptive,analytics,notifications
    env_file:
      - ../backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - futurelearning_net

  # 6. Celery Beat Periodic Job Scheduler
  celery_beat:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: futurelearning_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    env_file:
      - ../backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - futurelearning_net

networks:
  futurelearning_net:
    driver: bridge
