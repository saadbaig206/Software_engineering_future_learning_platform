name: FutureLearning Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Lint, Security & Test Suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Lint Check
        run: |
          ruff check backend/

      - name: Run Django System Check
        env:
          SECRET_KEY: test-ci-secret-key-not-for-prod
          DATABASE_URL: sqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
        run: |
          python backend/manage.py check

      - name: Run Pytest Test Suite
        env:
          SECRET_KEY: test-ci-secret-key-not-for-prod
          DATABASE_URL: sqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
        run: |
          cd backend && pytest --verbose --cov=apps

  frontend-test:
    name: Frontend Lint, Typecheck & Accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm ci

      - name: Run TypeScript Verification
        run: |
          cd frontend && npm run type-check

      - name: Run Frontend Tests
        run: |
          cd frontend && npm test --if-present
